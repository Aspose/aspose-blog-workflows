name: AWS Prod-3. Deploy Tags

on:
  workflow_dispatch: # Manual trigger only
  workflow_call:

jobs:
  build-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 450 # Increased timeout for the massive sync
    steps:
      - name: Checkout blog repo
        uses: actions/checkout@v4
        with:
          repository: Aspose/aspose-blog
          ref: master
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 1 # Faster checkout

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.120.4'
          extended: true

      - name: Maximize Space and RAM
        run: |
          # Deactivate swap if it somehow exists (ignore errors if it doesn't)
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile || true

          # Standard cleanup
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

          # Create the new swap
          echo "Allocating 20G swap file..."
          sudo fallocate -l 20G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          echo "Current memory status:"
          free -m
          df -h

      - name: Fast Content Preparation (Skeleton)
        run: |
            # Strip bodies, otherwise Hugo will OOM (Out of Memory) on tags
            find content/Aspose.Blog -name "*.md" -print0 | xargs -0 -I {} -P 4 sh -c "awk '/^---/ { count++ } { print } count == 2 { exit }' '{}' > '{}.tmp' && mv '{}.tmp' '{}'"
            
            # We don't need images for a Tag Sync, so we delete them to speed up the Hugo build
            find content/Aspose.Blog -type f ! -name "*.md" -delete

      - name: Build Tags Only
        env:
            # Hugo fills RAM and swap, then the runner dies. 30GiB of the 36GB total
            # makes Go collect garbage harder before that point instead of crashing.
            GOMEMLIMIT: 30GiB
        run: |
          # Runs inside this step because a background monitor in its own step goes
          # silent once that step ends, leaving no memory data for a crashed build.
          while true; do
            echo "--- RAM Check: $(date +'%H:%M:%S') ---"
            free -m
            ps -C hugo -o rss= | awk '{printf "hugo RSS: %d MB\n", $1/1024}'
            sleep 60
          done &
          MONITOR_PID=$!
          trap 'kill $MONITOR_PID' EXIT

          hugo \
            --config "config.yml,config.production.yml" \
            -b "https://blog.aspose.com/" \
            --gc \
            --logLevel info
            # Taxonomies are ENABLED by default here

      - name: Deploy Tags (The Long Sync)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS }}
        run: |
          echo "Starting massive Tag and Category sync..."
          # Strategy: Exclude everything first, then include only the taxonomy folders
          aws s3 sync public/ s3://blog.aspose.com/ \
            --size-only \
            --exclude "*" \
            --include "tag/*" \
            --include "*/tag/*" \
            --include "search/*" \
            --include "*/search/*" \
            --follow-symlinks

      - name: Invalidate CloudFront – Tags, Categories & Search
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          PATHS: "/tag/* /*/tag/* /categories/* /*/categories/* /search/* /*/search/*"
          AWS_REGION: us-west-2
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS }}            