name: Ceph Staging - Pipeline

on:
  schedule:
    - cron: "0 1 * * 1-5" # Runs between 8-9 AM GMT+5 Mon-Fri

  workflow_dispatch: # So the whole chain can be triggered manually

jobs:
  check-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Find last deploy attempt
        id: last-run
        uses: actions/github-script@v7
        with:
          script: |
            // A run's own "success" can't be the baseline: runs that skipped
            // for no changes and runs where job2/job3 were skipped both report
            // success. Only the newest run that attempted a deploy counts, and
            // only if it reached the end of the chain. Otherwise `since` stays
            // empty and this run deploys again, even with no new commits.
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ceph-staging-pipeline.yml',
              status: 'completed',
              per_page: 30,
            });
            for (const run of data.workflow_runs) {
              const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const attempted = jobs.some((j) => j.name.startsWith('job1') && j.conclusion !== 'skipped');
              if (!attempted) continue;
              const complete = jobs.some((j) => j.name.startsWith('job3') && j.conclusion === 'success');
              core.info(`Last deploy attempt: ${run.html_url} (created ${run.created_at}, complete: ${complete})`);
              // created_at, not run_started_at: re-running a failed job moves
              // run_started_at forward, but job1 deployed at the original time.
              if (complete) core.setOutput('since', run.created_at);
              return;
            }

      - name: Check for new commits in content repo since last complete deploy
        id: check
        uses: actions/github-script@v7
        env:
          SINCE: ${{ steps.last-run.outputs.since }}
        with:
          github-token: ${{ secrets.REPO_TOKEN }}
          script: |
            const since = process.env.SINCE;
            if (!since) {
              core.info('Last deploy attempt did not complete — running.');
              core.setOutput('should_run', true);
              return;
            }

            const { data: commits } = await github.rest.repos.listCommits({
              owner: 'Aspose',
              repo: 'aspose-blog',
              sha: 'master',
              since,
              per_page: 1,
            });

            // A commit made before the baseline but pushed after it has an old
            // date, so the commit list alone misses it. pushed_at counts any
            // branch, which at worst causes an extra deploy.
            const { data: contentRepo } = await github.rest.repos.get({
              owner: 'Aspose',
              repo: 'aspose-blog',
            });
            const pushedSince = new Date(contentRepo.pushed_at) > new Date(since);

            core.info(`Last complete deploy created at: ${since}`);
            core.info(`New commits in Aspose/aspose-blog since then: ${commits.length}`);
            core.info(`Last push to Aspose/aspose-blog: ${contentRepo.pushed_at}`);
            core.setOutput('should_run', commits.length > 0 || pushedSince);

  job1:
    needs: check-changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.should_run == 'true')
    uses: ./.github/workflows/staging-ceph-deploy-blog-posts.yml
    secrets: inherit # Pass secrets if your sub-workflows need them

  job2:
    needs: job1
    # Required: a manual run skips check-changes, and a job without its own `if`
    # is skipped when anything up its needs chain was skipped.
    if: ${{ !cancelled() && needs.job1.result == 'success' }}
    uses: ./.github/workflows/staging-ceph-deploy-home-pages.yml
    secrets: inherit

  job3:
    needs: job2
    if: ${{ !cancelled() && needs.job2.result == 'success' }}
    uses: ./.github/workflows/staging-ceph-deploy-tags.yml
    secrets: inherit

  purge-bunnycdn:
    needs: job3
    if: ${{ !cancelled() && needs.job3.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # api.dynabic.com/bn/purge is Dynabic's own wrapper in front of BunnyCDN
      # (same provider as the s3-*.dynabic.com storage endpoints used above),
      # NOT bunny.net's public purge API directly -- that one is POST
      # https://api.bunny.net/purge with an `AccessKey` header, which is why
      # this looks different (GET, X-Api-Key) at a glance. continue-on-error
      # means a wrong assumption here fails soft (cache just stays warm
      # longer), never breaks the deploy -- but it also fails *silently*, so
      # after the first real run, check this step's log: `-i` prints the
      # response status/headers, confirm it's a 200 and not a 404/401/405.
      - name: Purge BunnyCDN Cache
        continue-on-error: true
        run: |
          curl -sfiG \
            -H "X-Api-Key: ${{ secrets.BUNNY_API_KEY }}" \
            --data-urlencode "url=https://blog-qa.aspose.com" \
            "https://api.dynabic.com/bn/purge?async=true"