name: Ceph Production - Pipeline

on:
  schedule:
    - cron: "0 6 * * 1-5" # Runs between 11 AM-12 PM GMT+5 Mon-Fri (3 hours after AWS Production)

  workflow_dispatch: # So the whole chain can be triggered manually

jobs:
  check-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Find last successful run
        id: last-run
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ceph-production-pipeline.yml',
              status: 'success',
              per_page: 1,
            });
            const lastRun = data.workflow_runs[0];
            core.setOutput('since', lastRun ? lastRun.run_started_at : '');

      - name: Check for new commits in content repo since last successful run
        id: check
        uses: actions/github-script@v7
        env:
          SINCE: ${{ steps.last-run.outputs.since }}
        with:
          github-token: ${{ secrets.REPO_TOKEN }}
          script: |
            const since = process.env.SINCE;
            if (!since) {
              core.info('No previous successful run found — running.');
              core.setOutput('should_run', true);
              return;
            }

            const { data: commits } = await github.rest.repos.listCommits({
              owner: 'Aspose',
              repo: 'aspose-blog',
              sha: 'master',
              since,
              per_page: 1,
            });

            core.info(`Last successful run started at: ${since}`);
            core.info(`New commits in Aspose/aspose-blog since then: ${commits.length}`);
            core.setOutput('should_run', commits.length > 0);

  job1:
    needs: check-changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.should_run == 'true')
    uses: ./.github/workflows/production-ceph-deploy-blog-posts.yml
    secrets: inherit # Pass secrets if your sub-workflows need them

  job2:
    needs: job1
    uses: ./.github/workflows/production-ceph-deploy-home-pages.yml
    secrets: inherit

  job3:
    needs: job2
    uses: ./.github/workflows/production-ceph-deploy-tags.yml
    secrets: inherit
