name: Production - Temp

on:
  # push:
  #   branches:
  #     - main  # Set a branch to deploy
  #   Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog repo
        uses: actions/checkout@main
        with:
          repository: Aspose/aspose-blog
          token: ${{ secrets.REPO_TOKEN }}
          #submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2.4.13
        with:
          hugo-version: '0.120.4'
          extended: true
      
      # 1. FREE DISK & CREATE SWAP (Extends RAM from 7GB to 17GB)
      - name: Extend Memory with Swap
        run: |
          # Deactivate swap if it somehow exists (ignore errors if it doesn't)
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile || true

          # Standard cleanup
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

          # Create the new swap
          echo "Allocating 10G swap file..."
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          echo "Current memory status:"
          free -m

      # 2. CACHE HUGO RESOURCES (Speed Boost)
      - name: Cache Hugo Resources
        uses: actions/cache@v4
        with:
          path: resources
          key: ${{ runner.os }}-hugo-cache-${{ hashFiles('config.yml', 'config.production.yml') }}
          restore-keys: |
            ${{ runner.os }}-hugo-cache-

      - name: Build
        run: hugo --config "config.yml,config.production.yml"
        # run: hugo --config "config.yml" --cleanDestinationDir --minify
    
      - name: Deploy Home to S3
        run: hugo deploy --maxDeletes -1 --config "config.yml,config.production.yml" --target "production-aws"
        # run: hugo deploy --maxDeletes -1 --target "production"

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS }}

      - name: Invalidate CloudFront
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          PATHS: '/*'
          AWS_REGION: 'us-west-2'
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS }}
